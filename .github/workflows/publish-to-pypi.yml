name: Publish to PyPI
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install build
      - run: python -m build
      - name: Reject non-clean versions (.dev / .post)
        run: |
          python - <<'PY'
          import glob, sys
          whl = sorted(glob.glob('dist/*.whl'))[0]
          ver = whl.split('-')[1]
          print(f"Built version: {ver}")
          if 'dev' in ver or 'post' in ver:
              sys.exit(f"::error::Refusing to publish non-clean version '{ver}'. "
                       "Create the GitHub Release from an exact version tag (e.g. vX.Y.Z).")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verify-metadata: true
          attestations: true
